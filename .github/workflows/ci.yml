name: CI

on:
  push:
    branches: ["main", "rebuilt-main-20260812"]
  pull_request:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      python: ${{ steps.filter.outputs.python }}
      native: ${{ steps.filter.outputs.native }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          docs=false
          python=false
          native=false
          full=false

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            docs=true
            python=true
            native=true
            full=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
            else
              base="$BEFORE_SHA"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}"; then
              changed_files="$(git ls-files)"
            else
              changed_files="$(git diff --name-only "$base" "$GITHUB_SHA")"
            fi

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                *.md|docs/*|*.csv|*.json|*.yaml|*.yml|*.toml|*.zip|*.tgz|*.tar.gz)
                  docs=true
                  ;;
              esac
              case "$path" in
                *.py|*.sh|pyproject.toml|pytest.ini|requirements*.txt|Makefile|Dockerfile*|tests/*|narrowgate/*|live/*|strategy/*|execution/*|features/*|data/*|models/*|examples/*|research/*)
                  if [[ "$path" != *.md ]]; then
                    python=true
                  fi
                  ;;
              esac
              case "$path" in
                cpp/*|strategy/quote_core.py|strategy/signal.py|strategy/native_runtime.py|models/backtest_tick.py|models/replay/*|tests/test_cpp_*|tests/*_cpp_*.py|tests/test_fill_selection_feature_parity.py)
                  native=true
                  ;;
              esac
              if [[ "$path" == ".github/workflows/ci.yml" ]]; then
                docs=true
                python=true
                native=true
              fi
              if [[ "$path" == "scripts/audit_public_documentation.py" ]]; then
                docs=true
              fi
            done <<< "$changed_files"
          fi

          {
            echo "docs=$docs"
            echo "python=$python"
            echo "native=$native"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Public lint and documentation audit
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install quality tools
        if: ${{ needs.changes.outputs.python == 'true' }}
        run: python -m pip install 'ruff>=0.5'

      - name: Lint public style and repository correctness once
        if: ${{ needs.changes.outputs.python == 'true' }}
        run: |
          ruff check narrowgate examples --select E,F,I,UP,B
          git ls-files -z '*.py' | xargs -0 -r ruff check --

      - name: Audit public documentation once
        run: python scripts/audit_public_documentation.py --repo-root .

  base-install-smoke:
    name: Base install smoke
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' && needs.changes.outputs.full != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install base package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Base-only public workflow smoke
        run: |
          narrowgate doctor
          narrowgate quote-demo
          narrowgate replay-demo \
            --output-dir "${RUNNER_TEMP}/narrowgate-replay-demo" \
            --verify-reference
          python examples/order_level_score_demo.py
          python -m unittest discover -s tests -p 'test_public_onboarding.py' -v

      - name: Wheel package boundary smoke
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/wheelhouse" .
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --no-deps \
            "${RUNNER_TEMP}"/wheelhouse/narrowgate-*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c \
            'import research.families.f03_causal_13_head.audit as audit; print(audit.__file__)'
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c \
            'from research.families.f07_active_order_continuation.audit.order_lifecycle_v2_runtime_compatibility_v1_6 import frozen_successor_path; print(frozen_successor_path())'

  python:
    name: Python 3.12 full public suite and native parity
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python and native test dependencies once
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install -e cpp
          python -c "import narrowgate_cpp; print(narrowgate_cpp.__file__)"

      - name: Run full public suite including native tests
        id: pytest
        run: pytest -q --junitxml=.pytest-results.xml

      - name: Publish failing pytest node IDs
        if: ${{ failure() && steps.pytest.outcome == 'failure' }}
        run: python scripts/report_pytest_failures.py

  full-python:
    name: Nightly Python 3.11 full suite and native parity
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python and native test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install -e cpp
          python -c "import narrowgate_cpp; print(narrowgate_cpp.__file__)"

      - name: Run full public suite
        id: pytest
        run: pytest -q --junitxml=.pytest-results.xml

      - name: Publish failing pytest node IDs
        if: ${{ failure() && steps.pytest.outcome == 'failure' }}
        run: python scripts/report_pytest_failures.py

  admission:
    name: CI admission
    needs: [changes, quality, base-install-smoke, python, full-python]
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      BASE_RESULT: ${{ needs['base-install-smoke'].result }}
      PYTHON_RESULT: ${{ needs.python.result }}
      NIGHTLY_RESULT: ${{ needs['full-python'].result }}
    steps:
      - name: Require every applicable boundary
        run: |
          test "$CHANGES_RESULT" = success
          for result in "$QUALITY_RESULT" "$BASE_RESULT" "$PYTHON_RESULT" "$NIGHTLY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
