name: CI

on:
  push:
    branches: ["main", "rebuilt-main-20260812"]
  pull_request:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      compatibility:
        description: Also run the Python 3.11 compatibility suite
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed paths
    if: ${{ github.event_name != 'schedule' || github.repository == 'xiao-nanbei/NarrowGateMaker' }}
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      python: ${{ steps.filter.outputs.python }}
      native: ${{ steps.filter.outputs.native }}
      frontend: ${{ steps.filter.outputs.frontend }}
      full: ${{ steps.filter.outputs.full }}
      regression: ${{ steps.regression.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPATIBILITY: ${{ inputs.compatibility }}
        run: |
          set -euo pipefail

          docs=false
          python=false
          native=false
          frontend=false
          full=false

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            docs=true
            python=true
            native=true
            frontend=true
            if [[ "$EVENT_NAME" == "schedule" || "$COMPATIBILITY" == "true" ]]; then
              full=true
            fi
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
            else
              base="$BEFORE_SHA"
            fi
            # Alpha amends replace the root commit. Fetch the previous tip so
            # a small change does not look like a fresh upload of every file.
            if [[ "$base" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$base" || true
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}"; then
              changed_files="$(git ls-files)"
            else
              changed_files="$(git diff --name-only "$base" "$GITHUB_SHA")"
            fi

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                *.md|docs/*|*.csv|*.json|*.yaml|*.yml|*.toml|*.zip|*.tgz|*.tar.gz)
                  docs=true
                  ;;
              esac
              case "$path" in
                *.py|*.sh|pyproject.toml|pytest.ini|requirements*.txt|Makefile|Dockerfile*|tests/*|narrowgate/*|live/*|strategy/*|execution/*|features/*|data/*|models/*|examples/*|research/*)
                  if [[ "$path" != *.md && "$path" != narrowgate/studio_static/* ]]; then
                    python=true
                  fi
                  ;;
              esac
              case "$path" in
                cpp/*|strategy/quote_core.py|strategy/signal.py|strategy/native_runtime.py|models/backtest_tick.py|models/replay/*|tests/test_cpp_*|tests/*_cpp_*.py|tests/test_fill_selection_feature_parity.py)
                  native=true
                  ;;
              esac
              case "$path" in
                frontend/*|narrowgate/studio_static/*|narrowgate/studio.py|narrowgate/replay_demo.py|narrowgate/fixtures/replay_demo/*|pyproject.toml)
                  frontend=true
                  ;;
              esac
              if [[ "$path" == ".github/workflows/ci.yml" ]]; then
                docs=true
                python=true
                native=true
                frontend=true
              fi
              if [[ "$path" == "scripts/audit_public_documentation.py" ]]; then
                docs=true
              fi
            done <<< "$changed_files"
          fi

          {
            echo "docs=$docs"
            echo "python=$python"
            echo "native=$native"
            echo "frontend=$frontend"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"

      - name: Select primary or mirror regression responsibility
        id: regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          required = True
          if (os.environ["GITHUB_REPOSITORY"] == "xiao-nanbei/NarrowGateMaker-private"
                  and os.environ["GITHUB_EVENT_NAME"] == "push"):
              # Only exact primary-tree mirrors skip duplicate full regression.
              # Unique changes or unavailable identity evidence run the full suite.
              try:
                  request = urllib.request.Request(
                      "https://api.github.com/repos/xiao-nanbei/NarrowGateMaker/commits/main",
                      headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      primary = json.load(response)
                  local_tree = subprocess.check_output(
                      ["git", "rev-parse", "HEAD^{tree}"], text=True
                  ).strip()
                  required = primary["commit"]["tree"]["sha"] != local_tree
              except Exception as exc:
                  print(f"Primary identity unavailable; require full regression: {type(exc).__name__}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"required={str(required).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Full regression: " + (
                  "required here.\n" if required else
                  "delegated to identical primary tree in NarrowGateMaker; this mirror run "
                  "still checks packaging, public boundaries and applicable frontend. "
                  "Mirror success alone is not proof that primary regression passed.\n"
              ))
          PY

  quality:
    name: Public lint and documentation audit
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        id: quality-python
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install quality tools
        id: quality-tools
        if: ${{ needs.changes.outputs.python == 'true' }}
        run: python -m pip install -e '.[dev]'

      - name: Repository correctness
        if: ${{ !cancelled() && steps.quality-tools.outcome == 'success' }}
        run: git ls-files -z '*.py' | xargs -0 -r python -m ruff check --

      - name: Public style
        if: ${{ !cancelled() && steps.quality-tools.outcome == 'success' }}
        run: python -m ruff check narrowgate examples --extend-select E,I,UP

      - name: Audit public documentation once
        if: ${{ !cancelled() && steps.quality-python.outcome == 'success' }}
        run: python scripts/audit_public_documentation.py --repo-root .

  frontend:
    name: Studio frontend and packaged static assets
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: "11.19.0"
          package_json_file: frontend/package.json
          run_install: false
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and format-check frontend
        run: |
          pnpm run lint
          pnpm test
          pnpm run format:check

      - name: Build packaged frontend once
        run: pnpm run build

      - name: Require committed static assets to match source
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- narrowgate/studio_static/
          if [[ -n "$(git ls-files --others --exclude-standard -- narrowgate/studio_static/)" ]]; then
            echo "::error::Frontend build produced uncommitted static assets; rebuild and commit narrowgate/studio_static/."
            git status --short -- narrowgate/studio_static/
            exit 1
          fi

  base-install-smoke:
    name: Base install smoke
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install base package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Base-only public workflow smoke
        run: |
          narrowgate doctor
          narrowgate quote-demo
          narrowgate replay-demo \
            --output-dir "${RUNNER_TEMP}/narrowgate-replay-demo" \
            --verify-reference
          python examples/order_level_score_demo.py
          python -m unittest discover -s tests -p 'test_public_onboarding.py' -v

      - name: Wheel package boundary smoke
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/wheelhouse" .
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --no-deps \
            "${RUNNER_TEMP}"/wheelhouse/narrowgate-*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c \
            'import research.families.f03_causal_13_head.audit as audit; print(audit.__file__)'
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c \
            'from research.families.f07_active_order_continuation.audit.order_lifecycle_v2_runtime_compatibility_v1_6 import frozen_successor_path; print(frozen_successor_path())'

  python:
    name: Python 3.12 full public suite and native parity
    needs: changes
    if: ${{ needs.changes.outputs.regression == 'true' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python and native test dependencies once
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install -e cpp
          python -c "import narrowgate_cpp; print(narrowgate_cpp.__file__)"

      - name: Run full public suite including native tests
        id: pytest
        run: pytest -q --junitxml=.pytest-results.xml

      - name: Publish failing pytest node IDs
        if: ${{ failure() && steps.pytest.outcome == 'failure' }}
        run: python scripts/report_pytest_failures.py

  full-python:
    name: Nightly Python 3.11 full suite and native parity
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python and native test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install -e cpp
          python -c "import narrowgate_cpp; print(narrowgate_cpp.__file__)"

      - name: Run full public suite
        id: pytest
        run: pytest -q --junitxml=.pytest-results.xml

      - name: Publish failing pytest node IDs
        if: ${{ failure() && steps.pytest.outcome == 'failure' }}
        run: python scripts/report_pytest_failures.py

  admission:
    name: CI admission
    needs: [changes, quality, frontend, base-install-smoke, python, full-python]
    if: ${{ always() && needs.changes.result != 'skipped' }}
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BASE_RESULT: ${{ needs['base-install-smoke'].result }}
      PYTHON_RESULT: ${{ needs.python.result }}
      NIGHTLY_RESULT: ${{ needs['full-python'].result }}
    steps:
      - name: Require every applicable boundary
        run: |
          failed=0
          echo '### CI job results' >> "$GITHUB_STEP_SUMMARY"
          for name in CHANGES QUALITY FRONTEND BASE PYTHON NIGHTLY; do
            variable="${name}_RESULT"
            result="${!variable}"
            echo "- $name: $result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$name" == CHANGES && "$result" != success ]]; then
              echo "::error title=CI classification failed::CHANGES: $result"
              failed=1
              continue
            fi
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error title=CI job failed::$name: $result. Open that job for the original failure."
                failed=1
                ;;
            esac
          done
          exit "$failed"
