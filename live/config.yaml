      trade_channel: "publicTrade"
      max_source_age_s: 2.0
      record_enabled: false
      record_interval_ms: 0.0
      record_trades: true
      record_queue_size: 20000
      record_dir: "logs/external_venues"
    - venue: "bybit"
      enabled: false
      transport: "websocket"
      role: "reference"
      symbol: "BTCUSDT"
      instrument_type: "spot"
      product_type: "spot"
      quote_currency: "USDT"
      settlement_currency: "USDT"
      websocket_url: "wss://stream.bybit.com/v5/public/spot"
      book_channel: "orderbook.1"
      trade_channel: "publicTrade"
      max_source_age_s: 2.0
