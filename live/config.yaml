# ============================================================
#  NarrowGate Maker — Public Configuration Template
#  PUBLIC TEMPLATE: do not deploy this file to a real exchange account.
# ============================================================
#
# This repository keeps the public config intentionally generic. Private live
# parameters, model bundle names, host-specific paths, and experiment snapshots
# should live in an ignored local file such as:
#
#   docs/private/live_config.current.local.yaml
#
# Run locally with:
#
#   NARROWGATE_LIVE_CONFIG=docs/private/live_config.current.local.yaml \
#     bash live/run.sh start
#
# Validate before an owner-side deployment with:
#
#   NARROWGATE_LIVE_CONFIG=docs/private/live_config.current.local.yaml \
#     make deploy-preflight
#

project_name: "NarrowGate"
symbol: "BTCUSDC"
tick_size: 0.1
lot_size: 0.001
min_notional: 5.0

api:
  key: ""
  secret: ""
  testnet: true
  # Every synchronous REST call inherits this finite network deadline.
  timeout_s: 5.0
  # REST remains the production default. websocket_api_ab is restart-only,
  # bounded to a short qualification window, and must never be enabled by a
  # hot reload or an implicit fallback.
  order_transport: "rest"
  websocket_order_ab:
    # Empty resolves to Binance's exact official endpoint for api.testnet.
    url: ""
    connect_timeout_s: 3.0
    request_timeout_s: 2.0
    recv_window_ms: 5000
    latency_sample_limit: 4096
    max_runtime_s: 900.0

strategy:
  # AS-shaped empirical quote-controller inputs. These are safe examples, not
  # an exact AS/GLFT solution or a promoted parameter set.
  gamma: 0.01
  order_size: 0.001
  max_inventory: 0.01
  requote_interval: 10.0
  position_timeout: 0.0
  # sigma_sq is one-second absolute-price variance. Keep the AS integration
  # horizon explicit when quote cadence changes.
  # The current BTCUSDC operational baseline integrates one second of
  # absolute-price variance. Deploy configs must set this field explicitly.
  quote_horizon_s: 1.0
  # Explicit unit contract. null preserves the historical B0 mapping:
  # eta_inventory=gamma*q_ref, a_spread=risk_per_order=gamma,
  # execution_intensity_slope=kappa, risk_horizon_s=quote_horizon_s.
  inventory_reference_qty: 1.0
  eta_inventory: null
  a_spread: null
  risk_per_order: null
  execution_intensity_slope: null
  risk_horizon_s: null
  # The historical P3 pair projection is the behavior-identical B0 adapter.
  # The side-BBO mode is a behavior-changing replay candidate and stays off.
  historical_p3_scalar_adapter_enabled: true
  p3_side_bbo_floor_enabled: false
  trade_intensity_acceleration_spread_mult: null
  max_spread_bps: 12.0
  # Protective widening beyond this limit pauses only the side that adds
  # exposure. Inward compression is an explicit research arm.
  spread_cap_mode: "pause_exposure"
  rq_min: 5.0
  rq_max: 10.0
  kappa_ratio: 1.0
  depth_kappa_ratio: 0.3
  vol_power: 1.5
  leverage: 1
  eta: 0.5

  # Execution lifecycle examples. Keep these conservative for public demos.
  replace_min_price_change_ticks: 0.0
  replace_min_price_change_ticks_reducing: 0.0
  replace_min_interval_ms: 0.0
  replace_min_interval_ms_reducing: 0.0
  replace_pending_coalesce: true
  replace_cancel_first_exposure_increasing: false
  # Startup-only system arm. Normal quote REST leaves the market-data thread
  # and each side keeps only its latest desired quote. Safety cancel/close paths
  # remain synchronous. Enable only for a controlled live soak.

  # Guard / cooldown examples. These are disabled by default in the public
  # template because promotion requires symbol-specific replay/live evidence.
  adverse_guard_enabled: false
  adverse_pause: true
  adverse_markout_pause_hybrid: false
  defense_guard_enabled: false
  defense_pause: true
  fill_cooldown: 0.0
  # Same-side quantity units include add and reducing fills. The live baseline
  # clears them only when an opposite-side fill arrives.
  fill_cooldown_consecutive_reset_policy: "opposite_fill_only"
  fill_cooldown_reducing: 0.0
  fill_cooldown_reducing_campaign_only: false
  # Policy byte identities are derived from the deployment envelope. Legacy
  # YAML SHA fields remain parser-compatible for offline replay only.
  boolean_cooldown_policy_enabled: false
  boolean_cooldown_policy_path: ""
  boolean_cooldown_predicate_bundle_path: ""
  boolean_cooldown_ema_warmup_s: 2048.0
  boolean_cooldown_evidence_route: "private_deployment_approval"
  buy_e3_cooldown_policy_enabled: false
  buy_e3_cooldown_artifact_manifest_path: ""
  buy_e3_cooldown_policy_path: ""
  buy_e3_cooldown_predicate_bundle_path: ""
  buy_e3_cooldown_ema_warmup_s: 2048.0
  buy_e3_cooldown_evidence_route: "private_deployment_buy_e3"
  adaptive_add_cooldown_enabled: false
  adaptive_add_cooldown_gate_enabled: false
  # Post-fill quote response research surface. I shifts the pair center;
  # A widens only the exposure-increasing side. Disabled means exact no-op.
  post_fill_quote_response_enabled: false
  post_fill_quote_response_mode: "noop"  # noop | inventory_shift | flow_add_widen | hybrid
  post_fill_inventory_ticks_per_order_unit: 0.25
  post_fill_inventory_max_ticks: 4.0
  post_fill_flow_amplitude_mode: "excitation_ticks"  # or expected_adverse
  post_fill_flow_ticks_per_excitation: 2.0
  post_fill_flow_max_ticks: 8.0
  post_fill_flow_excitation_per_order_unit: 1.0
  post_fill_flow_max_excitation: 4.0
  post_fill_flow_expected_adverse_buy_ticks: 0.0
  post_fill_flow_expected_adverse_sell_ticks: 0.0
  post_fill_flow_add_distance_fraction_buy: 1.0
  post_fill_flow_add_distance_fraction_sell: 1.0
  post_fill_response_half_life_s: 20.0
  post_fill_response_half_life_min_s: 4.0
  post_fill_response_half_life_max_s: 120.0
  post_fill_response_volatility_ref_bps: 3.0
  post_fill_response_volatility_weight: 0.0
  post_fill_response_refill_edge_ref: 0.1
  post_fill_response_refill_weight: 0.0
  post_fill_response_repair_probability_anchor: 0.6
  post_fill_response_repair_probability_weight: 0.0
  markout_side_asymmetry_sign: 1.0   # maker-signed BUY/SELL EMA semantics require +1
  markout_horizon_s: 10.0     # exact fill-to-observation wall-clock horizon
  markout_ema_span_fills: 50  # alpha=2/(N+1); span, not half-life

  # Archived/direct live alpha paths remain disabled in public config.
  buy_fill_selection_shadow_enabled: false
  buy_fill_selection_live_enabled: false
  # BUY/SELL fill-hazard prediction only. No order action reads this signal.
  dynamic_fill_hazard_shadow_enabled: false
  dynamic_fill_hazard_shadow_model_path: ""
  dynamic_fill_hazard_shadow_model_sha256: ""
  dynamic_fill_hazard_shadow_sides: "BUY"
  dynamic_fill_hazard_shadow_exposure_ms: 100.0
  dynamic_fill_hazard_shadow_price_jump_ticks: 1.0
  # Separately hashed BUY-only action map. Public template remains disabled.
  dynamic_fill_hazard_action_enabled: false
  dynamic_fill_hazard_action_policy_path: ""
  dynamic_fill_hazard_action_policy_sha256: ""
  # Bounded next-generation action layer. Fixed quote parameters remain the
  # safety envelope; current evidence has not passed live promotion.
  state_conditioned_policy_mode: disabled  # disabled | shadow | active
  state_conditioned_policy_model_path: ""
  # Evidence-only pair projection. No action mode exists; candidate prices are
  # written to a dedicated CSV and never reach cancel/replace/place routing.
  cross_venue_fair_price_shadow_enabled: false

  # Shared live/replay quote controls.
  use_bar_pricing: false
  symmetric_size: false

ml:
  enabled: false
  vol_blend: 0.5
  skew_strength: 0.0
  asym_strength: 0.0
  gamma_dir_bonus: 0.0
  dir_threshold: 0.05
  ret_skew: 0.0
  ret_shift_max_pct: 0.3
  ret_demean_halflife: 0
  toxicity_horizon_s: 10
  model_dir: "models/example_model_bundle"

multi_market:
  enabled: false
  market_stage: "minimal"
  reference_symbol: "BTCUSDT"
  stablecoin_anchor_symbol: "USDCUSDT"
  global_flow_shadow_enabled: false
  global_reference_shadow_enabled: false

# Independent venue references are receive-time shadow inputs only. Public
# Bitget/Bybit/OKX market data do not require API keys.
external_venues:
  enabled: false
  shadow_only: true
  sources:
    - venue: "bitget"
      enabled: false
      transport: "websocket"
      role: "reference"
      symbol: "BTCUSDT"
      instrument_type: "perp"
      product_type: "USDT-FUTURES"
      quote_currency: "USDT"
      settlement_currency: "USDT"
      websocket_url: "wss://ws.bitget.com/v3/ws/public"
      book_channel: "books1"
      trade_channel: "publicTrade"
      max_source_age_s: 2.0
      record_enabled: false
      record_interval_ms: 0.0
      record_trades: true
      record_queue_size: 20000
      record_dir: "logs/external_venues"
    - venue: "bybit"
      enabled: false
      transport: "websocket"
      role: "reference"
