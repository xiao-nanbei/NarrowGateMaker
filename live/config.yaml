depth_execution:
  shadow_enabled: false
  log_interval_requotes: 6
  microprice_kappa:
    # Frozen name: weighted-mid proxy + top-N depth-ratio spread adapter;
    # neither is the published micro-price estimator or an identified GLFT kappa.
    enabled: false
  imbalance_asym:
    enabled: false
  depth_tox_spread:
    enabled: false

regime:
  enabled: true
  vol_baseline: 3.0
  gamma_scale_min: 0.5
  gamma_scale_max: 2.0
  liq_baseline: 0.0
  gamma_liq_scale_min: 0.5
  gamma_liq_scale_max: 3.0

fees:
  maker: 0.0                    # BTCUSDC maker fills are modeled at zero fee
  taker: 0.00036                # only real taker exits; replay window-end MTM does not charge this

websocket:
  depth_levels: 20
  depth_speed: 100
  # Keep the existing partial top-20 strategy feed unchanged. The separate
  # snapshot+diff book is used only for deep active-order queue/path state.
  deep_book_enabled: false
  deep_book_snapshot_levels: 1000
  deep_book_speed: 100
  deep_book_max_buffer_events: 20000
  deep_book_resync_backoff_s: 1.0
  deep_book_max_age_s: 2.0
  # Reconnect watchdogs only; quote cancel/block freshness gates live under risk.
  exec_stream_silence_timeout_s: 45.0
  anchor_stream_silence_timeout_s: 45.0

risk:
  max_daily_loss: 10.0
  max_position_value: 100.0
  emergency_close_dd: 20.0
  cooldown_after_loss: 30.0
  max_consecutive_losses: 3
  max_exec_book_age_s: 5.0  # historical replay end-to-end age ABI
  # Quote cancel/block gates, separate from the longer reconnect watchdog above.
  # Public examples only; deployment values must bind a feed/host latency profile.
  max_exec_book_visible_age_s: 5.0  # live stale gate: capture - receive
  max_exec_book_source_lag_s: 5.0   # separate receive - exchange transport gate
  sync_adjust_degrade_enabled: true
  sync_adjust_degrade_count: 2
  sync_adjust_abs_qty_threshold: 0.0
  sync_adjust_degrade_window_s: 300.0
  sync_adjust_pause_s: 120.0
  sync_adjust_reconnect_user_stream: true
  sync_adjust_cancel_orders: true
  circuit_breaker_sigma: 8.0
  # Public example only; production must calibrate this to its inventory horizon.
  pnl_volatility_horizon_s: 300.0
  exit_urgency_strength: 0.5
  urgency_time_weight: 0.3
  urgency_pnl_weight: 0.3
  urgency_signal_weight: 0.4

logging:
  level: "INFO"
  file: "logs/maker.log"
  console: true
  trade_log: "logs/trades.csv"
  quote_log: "logs/quote_decisions.csv"
  order_outcome_log: "logs/order_outcomes.csv"
  buy_fill_selection_shadow_log: "logs/buy_fill_selection_shadow.csv"
  dynamic_fill_hazard_shadow_log: "logs/dynamic_fill_hazard_shadow.csv"
  dynamic_fill_hazard_action_log: "logs/dynamic_fill_hazard_action.csv"
  state_conditioned_policy_shadow_log: "logs/state_conditioned_policy_shadow.csv"
  cross_venue_fair_price_shadow_log: "logs/cross_venue_fair_price_shadow.csv"
  inventory_campaign_shadow_enabled: false
  inventory_campaign_shadow_log: "logs/inventory_campaign_shadow.csv"
  live_perf_telemetry_log: "logs/live_perf_telemetry.csv"
  quote_snapshot_integrity_log: "logs/quote_snapshot_integrity.csv"
  # Receive-time tape is shadow-only and never changes quote policy. Keep the
  # public template off; a private live config can enable it for latency audits.
  market_tape_enabled: false
  market_tape_dir: "logs/market_tape"
  market_tape_record_books: true
  market_tape_record_trades: true
  market_tape_record_depth: false
  market_tape_book_interval_ms: 0.0
  market_tape_queue_size: 20000
  bad_trade_log_every: 100

performance:
  listen_key_renew: 1800
