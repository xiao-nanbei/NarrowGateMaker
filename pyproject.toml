[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrowgate"
version = "0.1.1"
description = "Maker strategy research framework with tick replay, evidence gates, and optional C++ acceleration."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "NarrowGate contributors" }]
keywords = ["market-making", "microstructure", "backtest", "tick-replay", "pybind11"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
data = [
  "pyarrow>=14.0",
  "requests>=2.28",
  "zstandard>=0.23",
]
# Authenticated third-party provider access is deliberately separate from
# public archive acquisition and from `all`; installing a client grants no
# account, data license, or research eligibility.
provider-cryptohft = [
  "cryptohftdata>=0.2.1",
]
research = [
  "pyarrow>=14.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "zstandard>=0.23",
]
live = [
  "requests>=2.28",
  "websocket-client>=1.6",
  "binance-futures-connector>=4.0",
  "pycryptodome>=3.19",
]
all = [
  "pytest>=8.0",
  "ruff>=0.5",
  "pyarrow>=14.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "zstandard>=0.23",
  "requests>=2.28",
  "websocket-client>=1.6",
  "binance-futures-connector>=4.0",
  "pycryptodome>=3.19",
]

[project.scripts]
narrowgate = "narrowgate.cli:main"

[tool.setuptools]
py-modules = [
  "calendar_features",
  "data_paths",
  "data_quality",
  "market_fusion",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "narrowgate",
  "narrowgate.*",
  "scripts",
  "scripts.*",
  "data",
  "data.*",
  "features",
  "features.*",
  "execution",
  "execution.*",
  "live",
  "live.*",
  "models",
  "models.*",
  "research",
  "research.*",
  "strategy",
  "strategy.*",
]
exclude = [
  "tests*",
  "cpp*",
  "*.private",
  "*.private.*",
]
namespaces = false

[tool.setuptools.package-data]
"*" = ["fixtures/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
# F/B correctness is the repository-wide default. CI supplies every tracked
# Python path explicitly, so adding a package or research module cannot evade
# the gate. The public API/examples surface receives the additional E/I/UP
# style gate in CI.
extend-exclude = [
  "models/saved*",
  "logs",
  "results",
  "docs/private",
]

[tool.ruff.lint]
select = ["F", "B"]
ignore = [
  "E501",
]
