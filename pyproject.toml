[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrowgate"
version = "0.1.0"
description = "Maker strategy research framework with tick replay, evidence gates, and optional C++ acceleration."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "NarrowGate contributors" }]
keywords = ["market-making", "microstructure", "backtest", "tick-replay", "pybind11"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
research = [
  "pyarrow>=14.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "zstandard>=0.23",
]
live = [
  "requests>=2.28",
  "websocket-client>=1.6",
  "binance-futures-connector>=4.0",
  "pycryptodome>=3.19",
]
all = [
  "pytest>=8.0",
  "ruff>=0.5",
  "pyarrow>=14.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "zstandard>=0.23",
  "requests>=2.28",
  "websocket-client>=1.6",
  "binance-futures-connector>=4.0",
  "pycryptodome>=3.19",
]

[project.scripts]
narrowgate = "narrowgate.cli:main"

[tool.setuptools]
py-modules = [
  "calendar_features",
  "data_paths",
  "data_quality",
  "market_fusion",
]
packages = [
  "narrowgate",
  "data",
  "data.quality",
  "features",
  "execution",
  "live",
  "live.orderbook",
  "live.venues",
  "models",
  "models.audit",
  "models.replay",
  "research",
  "research.families",
  "research.families.f01_fixed_parameter_racing",
  "research.families.f01_fixed_parameter_racing.audit",
  "research.families.f02_empirical_p3_touch",
  "research.families.f02_empirical_p3_touch.audit",
  "research.families.f03_causal_13_head",
  "research.families.f03_causal_13_head.audit",
  "research.families.f04_external_market_alpha",
  "research.families.f04_external_market_alpha.audit",
  "research.families.f05_fill_quality_quote_ev",
  "research.families.f05_fill_quality_quote_ev.audit",
  "research.families.f06_placement_fill_cif",
  "research.families.f06_placement_fill_cif.audit",
  "research.families.f07_active_order_continuation",
  "research.families.f07_active_order_continuation.audit",
  "research.families.f08_side_taker_lifecycle",
  "research.families.f08_side_taker_lifecycle.audit",
  "research.families.f09_campaign_action_uplift",
  "research.families.f09_campaign_action_uplift.audit",
  "research.families.f10_live_replay_attribution",
  "research.families.f10_live_replay_attribution.audit",
  "research.governance",
  "research.shared",
  "research.system_engineering",
  "research.system_engineering.audit",
  "strategy",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Reconstructed research and runtime modules retain frozen byte identities.
# The maintained public package and examples are the formatting/lint surface;
# historical imports remain covered by syntax, tests, hashes, and replay audits.
include = [
  "narrowgate/**/*.py",
  "examples/**/*.py",
]
extend-exclude = [
  "models/saved*",
  "logs",
  "results",
  "docs/private",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
]
